[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Advanced Calculator"
version = "0.1.0"
description = "A clean, modern Python application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black",
    "flake8"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]